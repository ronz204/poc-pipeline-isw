services:
  swampert-postgres:
    env_file: .env.local
    container_name: swampert-postgres
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    networks:
      - swampert-network
    volumes:
      - swampert-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped