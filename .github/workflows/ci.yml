name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: project
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: piper
          POSTGRES_PASSWORD: piper
          POSTGRES_DB: piper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piper -d piper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: piper
      POSTGRES_PASSWORD: piper
      POSTGRES_DB: piper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: project/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - name: End-to-end run on both datasets
        run: |
          uv run piper generate --output data
          uv run piper run data/sales_valid.csv | tee -a "$GITHUB_STEP_SUMMARY"
          uv run piper run data/sales_defective.csv | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etl-reports
          path: |
            project/reports/
            project/logs/
          if-no-files-found: warn
