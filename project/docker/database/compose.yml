services:
  piper-database:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - piper-data:/var/lib/postgresql/data
    networks:
      - piper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
