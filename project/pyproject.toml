[project]
name = "piper"
version = "0.1.0"
description = "ETL pipeline with DataOps practices: validation, quarantine, idempotent load, and per-run audit"

requires-python = ">=3.12"
dependencies = [
    "pandas>=3,<4",
    "pandera>=0.34.1",
    "psycopg[binary]>=3.3.6",
    "structlog>=26.1.0",
]

[project.scripts]
piper = "source.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "source"
module-root = ""
namespace = true

[tool.pytest.ini_options]
testpaths = ["testing"]
addopts = "-ra"
markers = ["integration: needs a running PostgreSQL (see POSTGRES_* variables)"]

[tool.ruff]
line-length = 110
indent-width = 2

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
